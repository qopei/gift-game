<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TG NFT Gifts</title>
    <script src="https://telegram.org"></script>
    <style>
        :root {
            --bg: #090a0f;
            --card: #12151e;
            --card-hover: #181c28;
            --border: #1f2433;
            --accent: #2ea6ff;
            --gold: #f5b041;
            --text: #ffffff;
            --muted: #7d8597;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; }
        body { background-color: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        /* Верхняя панель баланса */
        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; background: var(--card); border-bottom: 1px solid var(--border); z-index: 10; }
        .player-tag { font-size: 13px; color: var(--muted); font-weight: 600; }
        .balance-box { display: flex; align-items: center; gap: 6px; background: #1a1f2e; padding: 6px 14px; border-radius: 20px; border: 1px solid #2a3147; font-weight: 800; font-size: 16px; color: var(--gold); }

        /* Основная рабочая область */
        .main-content { flex: 1; overflow-y: auto; padding: 16px; padding-bottom: 90px; }
        .tab-view { display: none; animation: fadeIn 0.2s ease; }
        .tab-view.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

        /* ВКЛАДКА 1: ТАП */
        .tap-container { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 68vh; position: relative; }
        .tap-hint { color: var(--muted); font-size: 13px; margin-bottom: 24px; }
        .star-btn { width: 190px; height: 190px; border-radius: 50%; background: radial-gradient(circle, rgba(245,176,65,0.22) 0%, rgba(18,21,30,0.9) 70%); border: 2px solid rgba(245,176,65,0.45); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform 0.08s cubic-bezier(0.2, 0.8, 0.2, 1); box-shadow: 0 0 40px rgba(245, 176, 65, 0.15); position: relative; }
        .star-btn:active { transform: scale(0.92); }
        .star-icon { font-size: 86px; filter: drop-shadow(0 0 15px rgba(245, 176, 65, 0.6)); pointer-events: none; }
        
        .upgrade-card { width: 100%; max-width: 380px; background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 14px 16px; margin-top: 32px; display: flex; justify-content: space-between; align-items: center; }
        .upg-info h4 { font-size: 14px; margin-bottom: 3px; }
        .upg-info p { font-size: 12px; color: var(--muted); }
        .upg-btn { background: var(--accent); color: #fff; border: none; padding: 10px 14px; border-radius: 10px; font-weight: 700; font-size: 13px; cursor: pointer; }
        .upg-btn:disabled { background: #1e2333; color: var(--muted); cursor: not-allowed; }

        /* Вылетающие цифры при тапе */
        .float-num { position: fixed; font-weight: 800; font-size: 20px; color: var(--gold); pointer-events: none; animation: floatUp 0.8s ease-out forwards; z-index: 100; text-shadow: 0 2px 8px rgba(0,0,0,0.8); }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-75px) scale(1.2); } }

        /* ВКЛАДКА 2: КЕЙСЫ */
        .cases-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .case-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px 12px; text-align: center; cursor: pointer; transition: 0.15s; display: flex; flex-direction: column; justify-content: space-between; }
        .case-card:active { transform: scale(0.97); border-color: var(--accent); }
        .case-emoji { font-size: 48px; margin-bottom: 10px; }
        .case-title { font-size: 15px; font-weight: 700; margin-bottom: 6px; }
        .case-price { display: inline-block; background: #1a1f2e; color: var(--gold); padding: 5px 12px; border-radius: 12px; font-size: 13px; font-weight: 700; }
        .case-secret { border-color: #3b2d5e; background: linear-gradient(180deg, #12151e 0%, #191329 100%); }

        /* Модальное окно кейса и рулетки */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(5, 6, 10, 0.92); backdrop-filter: blur(6px); z-index: 50; flex-direction: column; justify-content: center; align-items: center; padding: 16px; }
        .modal-overlay.open { display: flex; }
        .modal-box { width: 100%; max-width: 440px; background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 20px; position: relative; }
        .modal-close { position: absolute; top: 14px; right: 16px; background: #1c2130; border: none; color: var(--muted); width: 30px; height: 30px; border-radius: 50%; font-size: 16px; cursor: pointer; }
        
        .roulette-box { position: relative; width: 100%; height: 130px; background: #090a0f; border: 1px solid var(--border); border-radius: 14px; overflow: hidden; margin: 16px 0; }
        .roulette-line { position: absolute; top: 0; left: 50%; width: 2px; height: 100%; background: var(--gold); z-index: 5; box-shadow: 0 0 10px var(--gold); }
        .roulette-strip { display: flex; height: 100%; align-items: center; will-change: transform; }
        .r-item { min-width: 106px; height: 106px; margin: 0 4px; background: #151924; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 6px; text-align: center; border-bottom: 3px solid #333; }
        
        .loot-preview { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 12px; max-height: 110px; overflow-y: auto; }
        .loot-chip { background: #181c28; border: 1px solid var(--border); padding: 4px 8px; border-radius: 8px; font-size: 11px; color: #cbd5e1; }
        .spin-action-btn { width: 100%; background: var(--accent); color: #fff; border: none; padding: 14px; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 10px; }
        .spin-action-btn:disabled { background: #1e2333; color: var(--muted); }

        /* ВКЛАДКА 3: ИНВЕНТАРЬ */
        .inv-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
        .inv-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .nft-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 12px; text-align: center; display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden; }
        .nft-badge { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.65); padding: 2px 6px; border-radius: 6px; font-size: 10px; font-weight: 700; color: var(--gold); border: 1px solid rgba(245,176,65,0.4); }
        .nft-bg-tag { font-size: 10px; color: #e2e8f0; background: rgba(255,255,255,0.1); padding: 2px 6px; border-radius: 6px; display: inline-block; margin-top: 4px; }
        .card-actions { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
        .btn-mint { background: linear-gradient(90deg, #6366f1, #8b5cf6); color: #fff; border: none; padding: 7px; border-radius: 8px; font-size: 11px; font-weight: 700; cursor: pointer; }
        .btn-sell { background: #1c2130; color: var(--gold); border: 1px solid #2b3247; padding: 7px; border-radius: 8px; font-size: 11px; font-weight: 700; cursor: pointer; }

        /* Нижняя навигация */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 68px; background: var(--card); border-top: 1px solid var(--border); display: flex; justify-content: space-around; align-items: center; z-index: 20; padding-bottom: env(safe-area-inset-bottom); }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--muted); font-size: 11px; font-weight: 600; gap: 4px; cursor: pointer; height: 100%; }
        .nav-item.active { color: var(--accent); }
        .nav-icon { font-size: 22px; }
    </style>
</head>
<body>

    <div class="top-bar">
        <span class="player-tag" id="userName">Коллекционер</span>
        <div class="balance-box"><span id="balance">0</span> ⭐️</div>
    </div>

    <div class="main-content">
        <!-- ВКЛАДКА ТАП -->
        <div id="tab-tap" class="tab-view active">
            <div class="tap-container">
                <div class="tap-hint">Жми на звезду, чтобы фармить ⭐️</div>
                <div class="star-btn" id="tapZone" onclick="handleTap(event)">
                    <div class="star-icon">⭐️</div>
                </div>

                <div class="upgrade-card">
                    <div class="upg-info">
                        <h4>Сила тапа: +<span id="tapPowerText">10</span> ⭐️</h4>
                        <p>Уровень <span id="tapLvlText">1</span></p>
                    </div>
                    <button class="upg-btn" id="upgBtn" onclick="upgradeTap()">Улучшить (300 ⭐️)</button>
                </div>
            </div>
        </div>

        <!-- ВКЛАДКА КЕЙСЫ -->
        <div id="tab-cases" class="tab-view">
            <div class="cases-grid" id="casesGrid"></div>
        </div>

        <!-- ВКЛАДКА ИНВЕНТАРЬ -->
        <div id="tab-inv" class="tab-view">
            <div class="inv-header">
                <h3>Мои подарки (<span id="invCount">0</span>)</h3>
            </div>
            <div class="inv-grid" id="invGrid"></div>
        </div>
    </div>

    <!-- МОДАЛКА ОТКРЫТИЯ КЕЙСА -->
